<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ghyll: The Game of Numbers</title>
	
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
	
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<div class="table-container">

		<!-- ป๊อปอัปกรอกชื่อ -->
		<div class="modal-overlay" id="joinModal">
			<div class="modal-card">
				<h2>ยินดีต้อนรับสู่ Ghyll (WELCOME)</h2>
				<div class="input-group">
					<input type="text" id="playerNickname" placeholder="กรอกชื่อเล่นของคุณ (Enter your nickname)">
				</div>
				<button class="btn-join" id="btnJoin">🚀 เข้าร่วมโต๊ะ (JOIN TABLE)</button>
			</div>
		</div>

		<!-- กระดานเกม/ห้องรอ -->
		<div class="game-board hidden" id="gameBoard">
			
			<!-- ข้อความสถานะกลางโต๊ะ -->
			<div class="lobby-status" id="lobbyStatus">
				WAITING FOR PLAYERS <br>
				<span class="status-count" id="playerCount">(1/2 minimum)</span>
			</div>

			<!-- เส้นประแสดง Empty Spot บนผ้าสักหลาด -->
			<div class="table-spot-outline spot-top-outline">
				<div class="outline-icon">👤</div>
				<div class="outline-text">Empty Spot</div>
			</div>
			<div class="table-spot-outline spot-left-outline">
				<div class="outline-icon">👤</div>
				<div class="outline-text">Empty Spot</div>
			</div>
			<div class="table-spot-outline spot-right-outline">
				<div class="outline-icon">👤</div>
				<div class="outline-text">Empty Spot</div>
			</div>

			<!-- Player 1 (YOU - ด้านล่าง) -->
			<div class="player-slot slot-bottom">
				<div class="player-avatar active">
					<img src="assets/profile/avatar_dino.png" alt="Dino Avatar" class="avatar-img">
				</div>
				<div class="player-info-card">
					<div class="player-name" id="displayPlayerName">PLAYER 1 (YOU)</div>
					<div class="hp-badge">❤️ 20</div>
				</div>
			</div>

			<!-- Player 2 (ด้านบน - เป็น Empty Spot) -->
			<div class="player-slot slot-top">
				<div class="player-avatar empty-avatar">
					<div class="avatar-icon">👤</div>
				</div>
				<div class="player-info-card">
					<div class="player-name">PLAYER 2</div>
					<div class="hp-badge">Empty Spot</div>
				</div>
			</div>

			<!-- Player 3 (ด้านซ้าย - เป็น Empty Spot) -->
			<div class="player-slot slot-left">
				<div class="player-avatar empty-avatar">
					<div class="avatar-icon">👤</div>
				</div>
				<div class="player-info-card">
					<div class="player-name">PLAYER 3</div>
					<div class="hp-badge">Empty Spot</div>
				</div>
			</div>

			<!-- Player 4 (ด้านขวา - เป็น Empty Spot) -->
			<div class="player-slot slot-right">
				<div class="player-avatar empty-avatar">
					<div class="avatar-icon">👤</div>
				</div>
				<div class="player-info-card">
					<div class="player-name">PLAYER 4</div>
					<div class="hp-badge">Empty Spot</div>
				</div>
			</div>

			<!-- ปุ่มควบคุมด้านล่าง -->
			<div class="lobby-action-container">
				<button class="btn-start disabled" disabled>รอผู้เล่นเพิ่ม...</button>
			</div>

		</div>

	</div>

	<script src="script.js"></script>
</body>
</html>
